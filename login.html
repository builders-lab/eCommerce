<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | OmniCart</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement">
    <span>Good finds. Great prices. Every day.</span>
    <span>Free delivery on orders over ₹999</span>
  </div>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">omni<span>cart</span></a>

    <form class="search-bar" action="#" method="get">
      <input type="search" name="q" placeholder="Search for something you'll love…">
      <button type="submit">Search</button>
    </form>

    <button class="menu-toggle" aria-label="Open menu">☰</button>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart <span class="cart-count">0</span></a>
      <a href="login.html">Sign in</a>
    </nav>
  </header>

  <!-- Login Form -->
  <div class="page-container">
    <h1>Sign in</h1>
    <p>Welcome back to OmniCart.</p>

    <form class="form" action="#" method="post">
      <label>
        Email address
        <input type="email" name="email" required placeholder="you@example.com">
      </label>
      <label>
        Password
        <input type="password" name="password" required minlength="6" placeholder="Your password">
      </label>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p class="form-footer">
        New to OmniCart? <a href="register.html">Create an account</a>
      </p>
    </form>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="logo">omni<span>cart</span></div>
    <p>A better everyday, one find at a time.</p>
    <span>College project · No real payments or orders</span>
  </footer>

</body>
</html>
