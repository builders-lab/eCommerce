<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | OmniCart</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement text-white text-center py-2">
    Good finds. Great prices. Every day. | Free delivery on orders over ₹999
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom px-4">
    <a class="navbar-brand logo" href="index.html">omni<span>cart</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <form class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" action="#" method="get">
        <input class="form-control me-2" type="search" name="q" placeholder="Search for something you'll love…">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <div class="d-flex gap-3 align-items-center">
        <a href="index.html" class="text-decoration-none text-dark">Home</a>
        <a href="cart.html" class="text-decoration-none text-dark">Cart <span class="badge bg-danger rounded-pill">0</span></a>
        <a href="login.html" class="btn btn-outline-dark btn-sm">Sign in</a>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="container py-5" style="max-width: 440px; min-height: 50vh;">
    <h1 class="fw-bold mb-1">Sign in</h1>
    <p class="text-secondary mb-4">Welcome back to OmniCart.</p>

    <form action="#" method="post">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required minlength="6" placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">Sign in</button>
      <p class="text-secondary small">New to OmniCart? <a href="register.html" class="text-decoration-none" style="color: var(--primary)">Create an account</a></p>
    </form>
  </div>

  <!-- Footer -->
  <footer class="border-top px-4 py-4 d-flex flex-wrap align-items-center gap-3 text-secondary small">
    <div class="logo">omni<span>cart</span></div>
    <p class="mb-0">A better everyday, one find at a time.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
