# Local Docker reverse proxy: serves the built SPA and forwards the backend routes.
# The deployment config lives in /nginx and expects TLS certs plus a rendered
# __BACKEND_UPSTREAM__ placeholder; this one talks to the compose service name.

upstream commerce_backend {
    server backend:8080;
    keepalive 32;
}

# The deployment config in /nginx/nginx.conf defines this map, but the stock
# nginx image used here ships its own main config that does not.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product image uploads go through /api/v1/images/upload.
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;

    # ^~ stops the static-asset regex below from stealing these paths.
    # Without it, /images/laptop1.jpg matches the \.jpg rule and 404s.
    location ^~ /api/ {
        proxy_pass http://commerce_backend;
    }

    location ^~ /auth/ {
        proxy_pass http://commerce_backend;
    }

    location ^~ /images/ {
        proxy_pass http://commerce_backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}